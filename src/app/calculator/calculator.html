<main class="calculator-page">
  <section class="calculator" aria-label="Calculatrice">
    <h1>Calculatrice</h1>

    <input
      class="display"
      type="text"
      [value]="display"
      readonly
      aria-label="Résultat"
    />

    <div class="buttons">
      <button class="function" type="button" (click)="clear()">
        C
      </button>

      <button class="function" type="button" (click)="deleteLastDigit()">
        ⌫
      </button>

      <button
        class="operator"
        type="button"
        (click)="chooseOperator('/')"
      >
        ÷
      </button>

      <button
        class="operator"
        type="button"
        (click)="chooseOperator('*')"
      >
        ×
      </button>

      <button type="button" (click)="enterNumber('7')">7</button>
      <button type="button" (click)="enterNumber('8')">8</button>
      <button type="button" (click)="enterNumber('9')">9</button>

      <button
        class="operator"
        type="button"
        (click)="chooseOperator('-')"
      >
        −
      </button>

      <button type="button" (click)="enterNumber('4')">4</button>
      <button type="button" (click)="enterNumber('5')">5</button>
      <button type="button" (click)="enterNumber('6')">6</button>

      <button
        class="operator"
        type="button"
        (click)="chooseOperator('+')"
      >
        +
      </button>

      <button type="button" (click)="enterNumber('1')">1</button>
      <button type="button" (click)="enterNumber('2')">2</button>
      <button type="button" (click)="enterNumber('3')">3</button>

      <button class="equals" type="button" (click)="calculate()">
        =
      </button>

      <button
        class="zero"
        type="button"
        (click)="enterNumber('0')"
      >
        0
      </button>

      <button type="button" (click)="enterDecimal()">.</button>
    </div>
  </section>
</main>
